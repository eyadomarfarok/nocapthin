<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لجين | 07</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c1526;--ink:#f5f0e5;--gold:#c6a56a;--muted:#b7b2aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:var(--ink);font-family:Alexandria,sans-serif;background:radial-gradient(circle at 16% 15%,#243b5d 0,transparent 28%),radial-gradient(circle at 82% 82%,#31203f 0,transparent 33%),var(--navy)}main{min-height:100vh;display:grid;place-items:center;padding:25px}.card{width:min(850px,100%);min-height:min(590px,calc(100vh - 50px));position:relative;display:grid;place-items:center;padding:50px 30px;overflow:hidden;text-align:center;border:1px solid rgba(198,165,106,.52);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.012));box-shadow:0 30px 75px rgba(0,0,0,.35),inset 0 0 70px rgba(198,165,106,.025)}.card::before,.card::after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(198,165,106,.38)}.card::before{top:19px;right:19px;border-left:0;border-bottom:0}.card::after{bottom:19px;left:19px;border-right:0;border-top:0}.content{position:relative;z-index:1}.eyebrow{margin:0 0 25px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:4px}.divider{display:flex;align-items:center;justify-content:center;gap:13px;color:var(--gold)}.divider::before,.divider::after{content:"";width:66px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.divider::after{transform:scaleX(-1)}h1{margin:20px 0 8px;font:700 clamp(55px,12vw,105px)/1.2 Marhey,cursive;letter-spacing:1px}.occasion{margin:0;font-size:clamp(16px,2.4vw,21px);color:#e5dfd3}.date{display:flex;align-items:center;justify-content:center;gap:19px;margin:35px 0;color:var(--gold);direction:ltr}.date strong{font:500 clamp(47px,8vw,70px)/1 Georgia,serif}.date span{width:1px;height:43px;background:rgba(198,165,106,.55)}.date small{font-size:11px;letter-spacing:2px}button{padding:13px 23px;border:1px solid rgba(198,165,106,.75);background:transparent;color:var(--ink);font:500 13px Alexandria,sans-serif;cursor:pointer;transition:.25s}button:hover{background:var(--gold);color:var(--navy)}#note{min-height:22px;margin:22px 0 0;color:var(--gold);font-size:13px;letter-spacing:.2px}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;color:var(--gold);opacity:.7;animation:glow 2.8s ease-in-out infinite alternate}@keyframes glow{to{opacity:1;transform:scale(1.55)}}
.wish-card{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:rgba(5,10,19,.68);opacity:0;visibility:hidden;transition:.3s}.wish-card.show{opacity:1;visibility:visible}.wish-card__inner{width:min(360px,100%);position:relative;padding:52px 28px 36px;text-align:center;color:var(--ink);background:linear-gradient(145deg,#15233a,#0c1526);border:1px solid rgba(198,165,106,.78);box-shadow:0 25px 65px rgba(0,0,0,.5);transform:translateY(18px) scale(.97);transition:.35s}.wish-card.show .wish-card__inner{transform:translateY(0) scale(1)}.wish-card__inner::before,.wish-card__inner::after{content:"";position:absolute;width:38px;height:38px;border-color:var(--gold);border-style:solid}.wish-card__inner::before{top:10px;right:10px;border-width:1px 1px 0 0}.wish-card__inner::after{bottom:10px;left:10px;border-width:0 0 1px 1px}.heart{display:grid;place-items:center;width:88px;height:88px;margin:0 auto 20px;border:1px solid rgba(198,165,106,.7);border-radius:50%;box-shadow:inset 0 0 24px rgba(198,165,106,.1)}.heart svg{width:46px;overflow:visible}.heart path{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:130;stroke-dashoffset:130}.wish-card.show .heart path{animation:drawHeart 1.4s .35s ease forwards}@keyframes drawHeart{to{stroke-dashoffset:0;fill:rgba(198,165,106,.13)}}.wish-card h3{margin:0 0 12px;font:700 27px Marhey,cursive;color:var(--gold)}.wish-card p{margin:0;line-height:2;color:#e5dfd3;font-size:14px}.close{position:absolute;top:12px;left:13px;border:0;padding:5px 9px;color:var(--muted);font-size:19px;line-height:1}@media(max-width:520px){.card::before,.card::after{width:80px;height:80px}.eyebrow{letter-spacing:2px}.date{margin:28px 0}}
</style></head><body><main><section class="card"><div class="stars" id="stars"></div><div class="content"><p class="eyebrow">BIRTHDAY EDITION</p><div class="divider">✦</div><h1>لجين</h1><p class="occasion">عيد ميلاد سعيد</p><div class="date"><strong>07</strong><span></span><small>OCTOBER<br>2026</small></div><button id="celebrate">أجمل الأمنيات ✦</button><p id="note">سنة جديدة مليانة نجاح وتوفيق وسعادة، وكل خطوة فيها تكون أجمل من اللي قبلها.</p></div></section></main>
<div class="wish-card" id="wishCard" role="dialog" aria-modal="true" aria-labelledby="wishTitle"><div class="wish-card__inner"><button class="close" id="closeCard" aria-label="إغلاق">×</button><div class="heart"><svg viewBox="0 0 64 58" aria-label="قلب"><path d="M32 53S5 37 5 17C5 7 17 2 25 7c4 2 7 6 7 6s3-4 7-6c8-5 20 0 20 10 0 20-27 36-27 36Z"/></svg></div><h3 id="wishTitle">لجين</h3><p>أتمنى لك أيامًا لطيفة،<br>ونجاحًا يفرّح قلبك دائمًا.</p></div></div>
<script>const stars=document.getElementById('stars');for(let i=0;i<30;i++){const s=document.createElement('span');s.className='star';s.textContent='✦';s.style.cssText=`right:${4+Math.random()*92}%;top:${4+Math.random()*92}%;font-size:${6+Math.random()*10}px;animation-delay:-${Math.random()*3}s`;stars.appendChild(s)}const card=document.getElementById('wishCard');document.getElementById('celebrate').addEventListener('click',()=>card.classList.add('show'));document.getElementById('closeCard').addEventListener('click',()=>card.classList.remove('show'));card.addEventListener('click',e=>{if(e.target===card)card.classList.remove('show')});</script>
</body></html>
