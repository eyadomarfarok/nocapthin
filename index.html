<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لجين | 07</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0c1526; --ink:#f5f0e5; --gold:#c6a56a; --muted:#b7b2aa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); font-family:Alexandria,sans-serif; background:radial-gradient(circle at 16% 15%,#243b5d 0,transparent 28%),radial-gradient(circle at 82% 82%,#31203f 0,transparent 33%),var(--navy); }
    main { min-height:100vh; display:grid; place-items:center; padding:25px; }
    .card { width:min(850px,100%); min-height:min(590px,calc(100vh - 50px)); position:relative; display:grid; place-items:center; padding:50px 30px; overflow:hidden; text-align:center; border:1px solid rgba(198,165,106,.52); background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.012)); box-shadow:0 30px 75px rgba(0,0,0,.35),inset 0 0 70px rgba(198,165,106,.025); }
    .card::before,.card::after { content:""; position:absolute; width:150px; height:150px; border:1px solid rgba(198,165,106,.38); }
    .card::before { top:19px; right:19px; border-left:0;border-bottom:0; }
    .card::after { bottom:19px; left:19px; border-right:0;border-top:0; }
    .content { position:relative; z-index:1; }
    .eyebrow { margin:0 0 25px; color:var(--gold); font-size:12px; font-weight:700; letter-spacing:4px; }
    .divider { display:flex; align-items:center; justify-content:center; gap:13px; color:var(--gold); }
    .divider::before,.divider::after { content:""; width:66px; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
    .divider::after { transform:scaleX(-1); }
    h1 { margin:20px 0 8px; font:700 clamp(55px,12vw,105px)/1.2 Marhey,cursive; letter-spacing:1px; }
    .occasion { margin:0; font-size:clamp(16px,2.4vw,21px); color:#e5dfd3; font-weight:400; }
    .date { display:flex; align-items:center; justify-content:center; gap:19px; margin:35px 0; color:var(--gold); direction:ltr; }
    .date strong { font:500 clamp(47px,8vw,70px)/1 Georgia,serif; }
    .date span { width:1px; height:43px; background:rgba(198,165,106,.55); }
    .date small { font-size:11px; letter-spacing:2px; }
    button { padding:13px 23px; border:1px solid rgba(198,165,106,.75); background:transparent; color:var(--ink); font:500 13px Alexandria,sans-serif; cursor:pointer; transition:.25s; }
    button:hover { background:var(--gold); color:var(--navy); }
    #note { min-height:22px; margin:22px 0 0; color:var(--gold); font-size:13px; letter-spacing:.2px; }
    .stars { position:absolute; inset:0; pointer-events:none; }
    .star { position:absolute; color:var(--gold); opacity:.7; animation:glow 2.8s ease-in-out infinite alternate; }
    @keyframes glow { to { opacity:1; transform:scale(1.55); } }
    @media (max-width:520px) { .card::before,.card::after{width:80px;height:80px}.eyebrow{letter-spacing:2px}.date{margin:28px 0} }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="stars" id="stars"></div>
      <div class="content">
        <p class="eyebrow">BIRTHDAY EDITION</p>
        <div class="divider">✦</div>
        <h1>لجين</h1>
        <p class="occasion">عيد ميلاد سعيد</p>
        <div class="date"><strong>07</strong><span></span><small>OCTOBER<br>2026</small></div>
        <button id="celebrate">أجمل الأمنيات ✦</button>
        <p id="note" aria-live="polite">سنة جديدة مليانة نجاح وتوفيق وسعادة، وكل خطوة فيها تكون أجمل من اللي قبلها.</p>
      </div>
    </section>
  </main>
  <script>
    const stars=document.getElementById('stars');
    for(let i=0;i<30;i++){const s=document.createElement('span');s.className='star';s.textContent='✦';s.style.cssText=`right:${4+Math.random()*92}%;top:${4+Math.random()*92}%;font-size:${6+Math.random()*10}px;animation-delay:-${Math.random()*3}s`;stars.appendChild(s)}
    document.getElementById('celebrate').addEventListener('click',()=>{document.getElementById('note').textContent='تمنيات بنجاح كبير، حظ جميل، وسعادة تليق بيكي.';});
  </script>
</body>
</html>
